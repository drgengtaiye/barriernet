version: 1
name: "barriernet 0.3 weighted score"
description: >-
  Gene weights of the barriernet 0.3 score (column barriernet03), frozen on 2026-10-31 after development on 20
  single-arm checkpoint cohorts only (module weights by ridge logistic regression with cohort intercepts, selected by
  leave-one-cohort-out validation). Every gene of a module has the same weight; weights sum to 1 in absolute value.
  Score = sum(w z) / sum(|w|) over the genes present; requires >= 3 genes and >= half of the 48.

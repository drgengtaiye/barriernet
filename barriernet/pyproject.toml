[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barriernet"
version = "0.4.0"
description = "Benchmarking published immune signatures against simple T-cell scores in randomized checkpoint-inhibitor trials; Barrier/NetImmune scoring and Visium ring/peak summaries."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Gengtai Ye", email = "yegt@smu.edu.cn"}]
maintainers = [{name = "Gengtai Ye", email = "yegt@smu.edu.cn"}]
keywords = ["tumor microenvironment", "gene signature", "spatial transcriptomics",
            "immune checkpoint blockade", "gastric cancer"]
dependencies = ["numpy", "pandas", "pyyaml", "scipy"]

[project.urls]
Homepage = "https://github.com/drgengtaiye/barriernet"
Repository = "https://github.com/drgengtaiye/barriernet"

[project.optional-dependencies]
spatial = ["anndata", "scanpy"]
report = ["matplotlib>=3.5"]
app = ["shiny>=1.0", "matplotlib>=3.5"]
test = ["pytest", "anndata", "matplotlib>=3.5"]

[project.scripts]
barriernet = "barriernet.cli:main"

[tool.setuptools]
packages = ["barriernet"]

[tool.setuptools.package-data]
barriernet = ["data/*.yaml", "data/*.tsv", "data/*.txt"]
